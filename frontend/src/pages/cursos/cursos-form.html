      </div>
    </div>

  <div class="container-fluid p-0"> 
    <div class="d-flex">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar-dark min-vh-100 py-3">
        <nav class="nav flex-column small sidebar-menu">
          <a class="nav-link d-flex align-items-center gap-2" href="../index.html">

          <hr class="my-3">

            Cadastros
          </span>
          <a class="nav-link d-flex align-items-center gap-2 active" href="cursos.html">
            <i class="bi bi-journal-bookmark"></i>
            <span class="sidebar-text">Cursos</span>
          </a>

          <a class="nav-link d-flex align-items-center gap-2" href="../locais/locais.html">
            <i class="bi bi-geo-alt"></i>

          </span>

            <i class="bi bi-people"></i>
            <span class="sidebar-text">Turmas</span>
          </a>
        </nav>

      <!-- Conteúdo principal -->
      <main class="flex-grow-1 p-4">
        <!-- Cabeçalho da tela -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">
          <div>
            <h1 class="h4 mb-0">Cadastro de Curso</h1>
            <small class="text-muted">Preencha os dados abaixo para cadastrar ou alterar um curso.</small>
          </div>
        </div>

        <!-- Formulário de cadastro -->
        <div class="card mb-3">
          <div class="card-body">
            <form id="curso-form">
              
              <!-- Linha 1: Nome do Curso -->
              <div class="row mb-3">
                <div class="col-12">
                  <label for="curso-nome" class="form-label form-label-sm">Nome <span class="text-danger">*</span></label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="curso-nome" 
                    name="nome" 
                    placeholder="Ex.: Python Avançado, Gestão de Projetos"
                    required>
                </div>
              </div>

              <!-- Linha 2: Carga horária, Valor inscrição e Modalidade -->
              <div class="row mb-3">
                <div class="col-sm-12 col-md-6 col-lg-6">
                  <label for="curso-carga-horaria" class="form-label form-label-sm">Carga horária (horas) <span class="text-danger">*</span></label>
                  <input 
                    type="number" 
                    class="form-control" 
                    id="curso-carga-horaria" 
                    name="carga_horaria" 
                    placeholder="Ex.: 40, 80"
                    step="1"
                    min="0"
                    required>
                </div>

                <div class="col-sm-12 col-md-4 col-lg-2">
                  <label for="curso-valor-inscricao" class="form-label form-label-sm">Valor inscrição <span class="text-danger">*</span></label>
                  <input 
                    type="number" 
                    class="form-control" 
                    id="curso-valor-inscricao" 
                    name="valor_inscricao" 
                    placeholder="Ex.: 500.00"
                    step="0.01"
                    min="0"
                    required>
                </div>

                <div class="col-sm-12 col-md-2 col-lg-4">
                  <label for="curso-modalidade" class="form-label form-label-sm">Modalidade <span class="text-danger">*</span></label>
                  <select 
                    class="form-select" 
                    id="curso-modalidade" 
                    name="modalidade_id"
                    required>
                    <option value="">Selecione</option>
                    <!-- Opções preenchidas por JavaScript no futuro -->
                  </select>
                </div>
              </div>

              <!-- Ações (Botões) -->
              <div class="row">
                <div class="col-12 d-flex justify-content-end gap-2">
                  <a href="cursos.html" class="btn btn-outline-secondary btn-sm bg-light">Cancelar</a>
                  <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
                </div>
              </div>

            </form>
          </div>
        </div>
      </main>
    </div>
  </div>
