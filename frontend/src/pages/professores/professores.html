<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link

    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"

  <link 
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.css"
    integrity="sha384-0BhIWKcZqG5KR1KTIeRg9FC62RTDWuUeyR1dsP2sv0fHx9X4+wOhEyRj4QN+7GAq"
    crossorigin="anonymous"
    onerror="this.removeAttribute('integrity'); this.href='../../../assets/lib/tom-select/tom-select.2.3.1.css';"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../../assets/css/main.css">
  <link rel="stylesheet" href="../../../assets/css/sections/sidebar.css">
</head>
<body class="bg-body-tertiary">
  <!-- Barra superior -->
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-0">
            <button id="toggleSidebar" class="btn btn-link btn-lg text-light me-3">
            <i class="bi bi-list"></i>
            </button>
            <span class="navbar-brand d-flex align-items-center gap-2">
                <span class="fw-bold">Gestão Acadêmica</span>
                <span class="badge bg-primary px-2 py-1 rounded">Talent Academy</span>
            </span>
        </div>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small">Antonio Jr</span>
        <button class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>
  <div class="container-fluid p-0"> 
    <div class="d-flex">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar-dark min-vh-100 py-3">
        <nav class="nav flex-column small sidebar-menu">
          <span class="text-uppercase sidebar-title fw-semibold mb-2 px-3">
            Cadastros
          </span>
          <a class="nav-link d-flex align-items-center gap-2" href="../cursos/cursos.html">
            <i class="bi bi-journal-bookmark"></i>
            <span class="sidebar-text">Cursos</span>
            </a>
          <a class="nav-link d-flex align-items-center gap-2 active" href="../professores/professores.html">
            <i class="bi bi-person-badge"></i>
            <span class="sidebar-text">Professores</span>
            </a>
          <a class="nav-link d-flex align-items-center gap-2" href="../locais/locais.html">
            <i class="bi bi-geo-alt"></i>
            <span class="sidebar-text">Locais</span>
            </a>
          <hr class="my-3">
          <span class="text-uppercase sidebar-title fw-semibold mb-2 px-3">
            Turmas
          </span>
          <a class="nav-link d-flex align-items-center gap-2" href="../turmas/turmas.html">
            <i class="bi bi-people"></i>
            <span class="sidebar-text">Turmas</span>
            </a>
        </nav>
      </aside>
      <!-- Conteúdo principal -->
      <main class="flex-grow-1 p-4">
        <!-- Cabeçalho da tela -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">
          <div>
            <h1 class="h4 mb-0">Professores</h1>
            <small class="text-muted">Cadastro e manutenção dos professores.</small>
          </div>
          <button class="btn btn-primary">
            Novo professor
          </button>
        </div>
        <!-- Filtros / barra de ações -->
       <form>
        <div class="card mb-3">
          <div class="card-body py-3">
            <!-- Linha 1: CPF e Nome -->
            <div class="row g-2 mb-3 align-items-end">
              <div class="col-sm-6 col-md-8 col-lg-9">
                <label class="form-label form-label-sm">Nome</label>
                <input id="nome" type="text" class="form-control form-control-sm" placeholder="Digite o nome">
              </div>
              <div class="col-sm-6 col-md-4 col-lg-3">
                <label class="form-label form-label-sm">CPF</label>
                <input id="cpf" type="text" class="form-control form-control-sm" placeholder="Digite o CPF">
              </div>
            </div>
            <!-- Linha 2: Curso, UF e Cidade -->
            <div class="row g-2 mb-3 align-items-end">
              <div class="col-sm-6 col-md-4 col-lg-7">
                <label class="form-label form-label-sm">Curso</label>
                <input id="nomeCurso" type="text" class="form-control form-control-sm" placeholder="Digite o nome do curso">
              </div>
              <div class="col-sm-6 col-md-4 col-lg-1">
                <label class="form-label form-label-sm">UF</label>
                <select class="form-select form-select-sm" id="uf" name="uf" data-placeholder="UF">
                  <option value="">Todas</option>
                </select>
              </div>
              <div class="col-sm-6 col-md-4 col-lg-4">
                <label class="form-label form-label-sm">Cidade</label>
                <select class="form-select form-select-sm" id="cidade" name="cidade" data-placeholder="Selecione a cidade">
                  <option value="">Todas</option>
                </select>
              </div>
            </div>
            <!-- Linha 3: Botão Filtrar alinhado à direita -->
            <div class="row g-2 align-items-end justify-content-end">
              <div class="col-auto">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Pesquisar</button>
                <button id="Limpar" type="button" class="btn btn-outline-secondary btn-sm bg-light">Limpar</button>
              </div>
            </div>
          </div>
        </div>
       </form>
        <!-- Tabela -->
        <section id="resultados-tabela-professores" class="mt-3 p-2"></section>
      </main>
    </div>
  </div>
  <script
    src="https://unpkg.com/vanilla-masker@1.1.1/build/vanilla-masker.min.js"
    integrity="sha384-12XSlvcHmo+GznHloktY+lT6qPgXYbPqMFGiY0JflahmzOxYAkfrK+YzvoBAH+qQ"
    crossorigin="anonymous">
  </script>
  <script 
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous">
  </script>
  <!-- biblioteca Tom Select -->
   <script 
  src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"
  integrity="sha384-cnROoUgVILyibe3J0zhzWoJ9p2WmdnK7j/BOTSWqVDbC1pVw2d+i6Q/1ESKJKCYf"
  crossorigin="anonymous"
></script>

<script>
  if (!window.bootstrap || !window.bootstrap.Popover) {
    console.warn('CDN do Bootstrap falhou. Carregando versão local...');
    const sc = document.createElement('script');
    sc.src = '../../../assets/lib/bootstrap/bootstrap.bundle.min-5.3.3.js';
    document.head.appendChild(sc);
  }
</script>
<script defer type="module" src="../../layout/sidebar.js"></script>
<script type="module" src="../../utils/modal-global.js"></script>
<script defer type="module" src="../../main/professor.main.js"></script>
</body>
