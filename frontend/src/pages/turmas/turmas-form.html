      <!-- Conteúdo principal -->
      <main class="flex-grow-1 p-4">
        <!-- Cabeçalho da tela -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">
          <div>
            <h1 class="h4 mb-0">Cadastro de Turma</h1>
            <small class="text-muted">Preencha os dados abaixo para cadastrar ou alterar uma turma.</small>
          </div>
        </div>

        <!-- Formulário de cadastro -->
        <div class="card mb-3">
          <div class="card-body">
            <form id="turma-form">
              
              <!-- Linha 1: Nome do Curso e Status -->
              <div class="row mb-3">
                <div class="col-sm-12 col-md-6 col-lg-9">
                  <label for="turma-curso" class="form-label form-label-sm">Nome do Curso <span class="text-danger">*</span></label>
                  <select 
                    class="form-select" 
                    id="turma-curso" 
                    name="curso_id"
                    required>
                    <option value="">Selecione um curso</option>
                    <!-- Opções preenchidas por JavaScript no futuro -->
                  </select>
                </div>

                <div class="col-sm-12 col-md-6 col-lg-3">
                  <label for="turma-status" class="form-label form-label-sm">Status da Turma <span class="text-danger">*</span></label>
                  <select 
                    class="form-select" 
                    id="turma-status" 
                    name="status"
                    required>
                    <option value="">Selecione</option>
                    <option value="planejamento">Planejamento</option>
                    <option value="andamento">Em Andamento</option>
                    <option value="finalizada">Finalizada</option>
                    <option value="cancelada">Cancelada</option>
                  </select>
                </div>
              </div>

              <!-- Linha 2: Professor e Local -->
              <div class="row mb-3">
                <div class="col-sm-12 col-md-6 col-lg-6">
                  <label for="turma-professor" class="form-label form-label-sm">Nome do Professor <span class="text-danger">*</span></label>
                  <select 
                    class="form-select" 
                    id="turma-professor" 
                    name="professor_id"
                    required>
                    <option value="">Selecione um professor</option>
                    <!-- Opções preenchidas por JavaScript no futuro -->
                  </select>
                </div>

                <div class="col-sm-12 col-md-6 col-lg-6">
                  <label for="turma-local" class="form-label form-label-sm">Nome do Local <span class="text-danger">*</span></label>
                  <select 
                    class="form-select" 
                    id="turma-local" 
                    name="local_id"
                    required>
                    <option value="">Selecione um local</option>
                    <!-- Opções preenchidas por JavaScript no futuro -->
                  </select>
                </div>
              </div>

              <!-- Linha 3: Período, Horário e Modalidade -->
              <div class="row mb-3">
                <div class="col-sm-12 col-md-8 col-lg-4">
                  <label for="turma-periodo" class="form-label form-label-sm">Período <span class="text-danger">*</span></label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="turma-periodo" 
                    name="periodo" 
                    placeholder="Ex.: 01/01/2024 a 31/03/2024"
                    required>
                </div>

                <div class="col-sm-12 col-md-4 col-lg-3">
                  <label for="turma-horario" class="form-label form-label-sm">Horário <span class="text-danger">*</span></label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="turma-horario" 
                    name="horario" 
                    placeholder="Ex.: 19:00 a 21:00"
                    required>
                </div>

                <div class="col-sm-12 col-md-6 col-lg-3">
                  <label for="turma-modalidade" class="form-label form-label-sm">Modalidade <span class="text-danger">*</span></label>
                  <select 
                    class="form-select" 
                    id="turma-modalidade" 
                    name="modalidade_id"
                    required>
                    <option value="">Selecione</option>
                    <!-- Opções preenchidas por JavaScript no futuro -->
                  </select>
                </div>
              </div>

              <!-- Linha 4: Dias da Semana -->
              <div class="row mb-3">
                <div class="col-12">
                  <label class="form-label form-label-sm">Dias da Semana <span class="text-danger">*</span></label>
                  <div class="d-flex flex-wrap gap-3">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="turma-seg" name="dias_semana" value="seg">
                      <label class="form-check-label" for="turma-seg">Segunda</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="turma-ter" name="dias_semana" value="ter">
                      <label class="form-check-label" for="turma-ter">Terça</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="turma-qua" name="dias_semana" value="qua">
                      <label class="form-check-label" for="turma-qua">Quarta</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="turma-qui" name="dias_semana" value="qui">
                      <label class="form-check-label" for="turma-qui">Quinta</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="turma-sex" name="dias_semana" value="sex">
                      <label class="form-check-label" for="turma-sex">Sexta</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="turma-sab" name="dias_semana" value="sab">
                      <label class="form-check-label" for="turma-sab">Sábado</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="turma-dom" name="dias_semana" value="dom">
                      <label class="form-check-label" for="turma-dom">Domingo</label>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Linha 5: Custo Professor e Valor Negociado -->
              <div class="row mb-3">
                <div class="col-sm-12 col-md-6 col-lg-6">
                  <label for="turma-custo-professor" class="form-label form-label-sm">Custo Professor</label>
                  <input 
                    type="number" 
                    class="form-control" 
                    id="turma-custo-professor" 
                    name="custo_professor" 
                    placeholder="Ex.: 1500.00"
                    step="0.01"
                    min="0">
                </div>

                <div class="col-sm-12 col-md-6 col-lg-6">
                  <label for="turma-valor-negociado" class="form-label form-label-sm">Valor Negociado Prof.</label>
                  <input 
                    type="number" 
                    class="form-control" 
                    id="turma-valor-negociado" 
                    name="valor_negociado_professor" 
                    placeholder="Ex.: 1800.00"
                    step="0.01"
                    min="0">
                </div>
              </div>

              <!-- Ações (Botões) -->
              <div class="row">
                <div class="col-12 d-flex justify-content-end gap-2">
                  <a href="turmas.html" class="btn btn-outline-secondary btn-sm bg-light">Cancelar</a>
                  <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
                </div>
              </div>

            </form>
          </div>
        </div>
      </main>
